<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
       
.home-btn:hover { background: #0056b3; }
        
        form { width: 300px; padding: 20px; border: 1px solid #ccc; border-radius: 10px; margin: 0 auto; }
        input[type="text"], input[type="password"], input[type="email"], select, textarea { width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>
     

    <form action="reg.php" method="POST" name="registration">
        <h2>Регистрация</h2>

        <label>Логин:</label>
        <input type="text" name="login" required placeholder="Придумайте логин">

        <label>E-mail:</label>
        <input type="email" name="email" required placeholder="example@mail.com">

        <label>Пароль:</label>
        <input type="password" name="pass" required>

        <label>Повторите пароль:</label>
        <input type="password" name="pass_confirm" required>

        <label>Пол:</label><br>
        <input type="radio" name="sex" value="m" checked> М
        <input type="radio" name="sex" value="w"> Ж
        <br><br>

        <label>Страна:</label>
        <select name="country">
            <option value="ru">Кыргызстан</option>
            <option value="by">Узбекистан</option>
            <option value="kz">Казахстан</option>
        </select>
        <br><br>

        <label>
            <input type="checkbox" name="agree" required> Я согласен с правилами
        </label>
        <br><br>

        <input type="submit" value="Создать аккаунт">
        <input type="reset" value="Очистить">
    </form>

</body>
</html>
