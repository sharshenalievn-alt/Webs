<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание простой формы</title>
    <script type="text/javascript">
        function myform(event) {
            event.preventDefault(); 
        
            const name = document.forms['userForm'].elements['name'].value;
            const surname = document.forms['userForm'].elements['surname'].value;
            
            if (name || surname) {
                alert("Здравствуйте, " + name + " " + surname + "!");
            } else {
                alert("Вы не ввели данные.");
            }
        }
    </script>
</head>
<body>
    <form name="userForm" onsubmit="myform(event)">
        <label for="username">Введите свое имя:</label>
        <input type="text" id="username" name="name" placeholder="Иван"> 
        <br><br>

        <label for="surname">Введите фамилию:</label>
        <input type="text" id="surname" name="surname" placeholder="Иванов">
        
        <br><br> 

        <label for="username">Пароль:</label>
        <input type="password" id="password" name="password" placeholder="Иванов775454">

        <br><br> 

         <label for="username">Пол:</label> <br>
         <input type="radio" name="sex" value="M" /> М <br>
          <input type="radio" name="sex" value="W"/> Ж 


        <br><br> 

           Ваш любимый цвет: <br />
        <select>
            <option>Синий</option>
            <option>Красный</option>
            <option>Зеленый</option>
        </select>

<br><br> 

   Расскажите о себе:<br />
   <textarea  cols="50" rows="30">   </textarea> 


        <br><br>         
        <input type="submit" value="Ок">
        <input type="reset" value="Очистить">

    </form> 
</body>
</html>
