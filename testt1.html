<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Подключаем Google Font (например, Roboto) -->
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(lightgreen, white  );
            font-family: Arial, Helvetica, sans-serif;
             display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .content-block {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        p {
            color: #7f8c8d;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }
        .my-img {
            align-content: center;
            width: 100%;
            height: auto;
            display: block;
            margin: 15px 0;
            border-radius: 8px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="content-block">
        <h1>Пистолет PM49 BLOWBACK</h1>
        <img src="image/Пистолет.jfif" class="my-img" >
        <button>Купить</button>
    </div>
</body>
</html>
